<script>
  /* ---------- App State ---------- */
  const app = {
    state: {
      page: 'beranda',
      today: '',
      tomorrow: '',
      settings: {},
      menu: [],
      customers: [],
      orders: [],
      expenses: [],
      loading: false
    },
    pendingActions: new Set(),
    toastQueue: [],

    /* ---------- API Wrapper ---------- */
    call: function (action, payload = {}) {
      const actionKey = `${action}_${JSON.stringify(payload)}`;
      if (this.pendingActions.has(actionKey)) return;

      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          this.pendingActions.delete(actionKey);
          reject({ code: 'INTERNAL', message: 'Waktu tunggu habis (20s).' });
        }, 20000);

        google.script.run
          .withSuccessHandler((result) => {
            clearTimeout(timeout);
            this.pendingActions.delete(actionKey);
            if (result.ok) resolve(result.data);
            else reject(result);
          })
          .withFailureHandler((err) => {
            clearTimeout(timeout);
            this.pendingActions.delete(actionKey);
            reject(err);
          })
          .api({ action, payload });
      });
    },

    /* ---------- UI Helpers ---------- */
    showToast: function (message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    },

    showSheet: function (show) {
      const sheet = document.getElementById('sheet-lainnya');
      if (show) {
        sheet.classList.add('open');
        document.getElementById('page-title').textContent = 'Lainnya';
      } else {
        sheet.classList.remove('open');
        document.getElementById('page-title').textContent = app.state.page.charAt(0).toUpperCase() + app.state.page.slice(1);
      }
    },

    navigate: function (page) {
      if (page === 'lainnya') {
        this.showSheet(true);
        return;
      }
      this.state.page = page;
      this.renderAll();
      this.showSheet(false);
    },

    /* ---------- Loading Data ---------- */
    loadDashboard: async function () {
      try {
        const result = await this.call('dashboard');
        app.state.todayPortions = result.today.portions;
        app.state.todayOmzet = result.today.omzet;
        app.state.todayMargin = result.today.margin;
        app.state.monthLabel = result.month.label;
        app.state.monthPortions = result.month.portions;
        app.state.monthOmzet = result.month.omzet;
        app.state.monthMargin = result.month.margin;
        app.state.cashTunai = result.cash.tunai;
        app.state.cashQRIS = result.cash.qris;
        app.state.cashTransfer = result.cash.transfer;
        app.state.cashTotal = result.cash.total;
        app.state.expensesMonth = result.expenses_month;
        app.state.netCashMonth = result.net_cash_month;
        app.state.unpaid = result.unpaid;
      } catch (err) {
        this.showToast('Gagal memuat dashboard: ' + err.message);
      }
    },

    loadOrders: async function () {
      try {
        const result = await this.call('listOrders');
        app.state.orders = result.orders;
      } catch (err) {
        console.log('Failed to load orders:', err);
      }
    },

    loadCustomers: async function () {
      try {
        const result = await this.call('listCustomers');
        app.state.customers = result.customers;
      } catch (err) {
        console.log('Failed to load customers:', err);
      }
    },

    loadMenu: async function () {
      try {
        const result = await this.call('listMenu');
        app.state.menu = result.menu;
      } catch (err) {
        console.log('Failed to load menu:', err);
      }
    },

    loadExpenses: async function () {
      try {
        const result = await this.call('listExpenses');
        app.state.expenses = result.expenses;
      } catch (err) {
        console.log('Failed to load expenses:', err);
      }
    },

    loadSettings: async function () {
      try {
        const result = await this.call('getSettings');
        app.state.settings = result.settings;
      } catch (err) {
        console.log('Failed to load settings:', err);
      }
    },

    /* ---------- Navigation Data Loading ---------- */
    loadComponent: async function () {
      await this.loadDashboard();
      await this.loadOrders();
      await this.loadCustomers();
      await this.loadMenu();
      await this.loadExpenses();
      await this.loadSettings();
      this.renderAll();
    },

    /* ---------- Render Functions ---------- */
    renderAll: async function () {
      // Delay slightly to ensure DOM is ready
      if (!document.querySelector('#page-' + app.state.page)) {
        return;
      }
      const page = app.state.page;
      const renderFn = renderFunctions[page] || renderFunctions['beranda'];
      await renderFn.call(renderFunctions);
    },

    /* ---------- Money Formatter ---------- */
    money: function (amount) {
      if (!amount && amount !== 0) return 'Rp 0';
      const num = Math.max(0, Math.round(Number(amount || 0)));
      return 'Rp ' + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    },

    /* ---------- Helper Functions ---------- */
    isoToDate: function (iso) {
      if (!iso) return new Date();
      const match = iso.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);
      if (match) {
        return new Date(Date.UTC(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3])));
      }
      return new Date(iso);
    },

    todayIso: function () {
      return new Date().toISOString().slice(0, 10);
    },

    addDaysIso: function (iso, days) {
      const date = this.isoToDate(iso);
      date.setUTCDate(date.getUTCDate() + days);
      return date.toISOString().slice(0, 10);
    },

    nowIso: function () {
      return new Date().toISOString().slice(0, 20);
    },

    parseDate: function (str) {
      if (!str) return '';
      const match = str.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);
      if (match) return str;
      const d = new Date(str);
      if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      return '';
    },

    pad: function (num, len) {
      return String(num).padStart(len, '0');
    },

    normalizePhone: function (phone) {
      if (!phone) return '';
      let cleaned = phone.replace(/\\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
      if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
      return cleaned;
    },

    normalizeNameKey: function (name) {
      if (!name) return '';
      return name
        .toString()
        .normalize('NFC')
        .replace(/[\\u2060\\uFEFF\\u200B-\\u200D\\uFE0F]/g, '')
        .replace(/[!"#$%&'()*+,./:;<=>?@[\\\\]^`{|}~]/g, '')
        .trim()
        .toLowerCase()
        .replace(/\\s+/g, ' ');
    },

    normalizeFlavor: function (s) {
      if (!s) return null;
      s = String(s)
        .normalize('NFC')
        .replace(/[\\u2060\\uFEFF\\u200B-\\u200D\\uFE0F]/g, '')
        .replace(/[!"#$%&'()*+,./:;<=>?@[\\\\]^`{|}~]/g, '')
        .trim()
        .toLowerCase();
      s = s.replace(/^\\s*\\d+\\s*[\\.\\)]\\s*/, '');
      const map = {
        'kulit krengsengan': 'M01',
        'kulit': 'M01',
        'krengsengan': 'M01',
        'mercon': 'M02',
        'rica': 'M03',
        'rica kemangi': 'M03',
        'kemangi': 'M03',
        'bumbu rendang': 'M04',
        'rendang': 'M04',
        'bumbu bebek': 'M05',
        'bebek': 'M05'
      };
      return map[s] || null;
    },

    normalizeMethod: function (method) {
      if (!method) return '';
      const m = String(method).trim().toLowerCase();
      if (m.includes('tunai')) return 'Tunai';
      if (m.includes('qris')) return 'QRIS';
      if (m.includes('bsi') || m.includes('transfer')) return 'Transfer';
      return '';
    },

    methodFromStatus: function (status) {
      if (!status) return '';
      const m = String(status).toLowerCase();
      if (m.includes('bsi') || m.includes('transfer')) return 'Transfer';
      if (m.includes('qris')) return 'QRIS';
      if (m.includes('cash')) return 'Tunai';
      return '';
    },
  };
</script>
