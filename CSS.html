<style>
    /* ---------- Core Reset ---------- */
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #FFF8EE;
        color: #1A3263;
        height: 100%;
        overflow: hidden;
    }

    /* ---------- Brand Colors ---------- */
    :root {
        --navy: #1A3263;
        --blue: #547792;
        --sand: #EFD2B0;
        --amber: #FFC570;
        --cream: #FFF8EE;
    }

    /* ---------- Typography ---------- */
    h1,
    h2,
    h3,
    h4 {
        margin: 0;
        font-weight: 400;
    }

    p {
        margin: 0 0 .5rem;
    }

    code {
        font-family: monospace;
    }

    /* ---------- Layout ---------- */
    #wrapper {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: -webkit-fill-available;
    }

    header {
        background: #1A3263;
        color: #fff;
        padding: .75rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
    }

    header .title {
        font-size: 1.25rem;
        font-weight: 600;
    }

    header .right {
        display: flex;
        gap: .5rem;
    }

    .content {
        flex: 1;
        overflow: auto;
        padding: 1rem;
        background: #FFF8EE;
    }

    footer {
        background: #fff;
        border-top: 1px solid #d6d6d6;
        display: flex;
        justify-content: space-around;
        padding: .5rem 0;
        box-shadow: 0 -2px 6px rgba(0, 0, 0, .1);
    }

    nav {
        display: flex;
        justify-content: space-around;
        width: 100%;
    }

    nav button {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .25rem;
        color: #1A3263;
        font-size: .85rem;
        padding: .5rem;
        border-radius: 8px;
        cursor: pointer;
    }

    nav button:hover {
        background: #F3E8D8;
    }

    nav button.active {
        color: #FFC570;
        font-weight: 600;
    }

    nav button .icon {
        width: 24px;
        height: 24px;
    }

    /* ---------- Cards & Surfaces ---------- */
    .card {
        background: #fff;
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
        box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
    }

    .card h3 {
        color: #1A3263;
        margin-bottom: .5rem;
    }

    .card p {
        color: #547792;
        line-height: 1.4;
    }

    /* ---------- Forms ---------- */
    input,
    select,
    textarea {
        width: 100%;
        padding: .75rem;
        border: 1px solid #d6d6d6;
        border-radius: 8px;
        background: #fff;
        color: #1A3263;
        font-size: 1rem;
        margin-bottom: .75rem;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #1A3263;
    }

    button.primary {
        background: #FFC570;
        color: #1A3263;
        border: none;
        padding: .75rem 1rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
    }

    button.primary:active {
        background: #E5B25A;
    }

    button.danger {
        background: #FFE5E5;
        color: #A60000;
        border: none;
        padding: .75rem 1rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
    }

    /* ---------- Chips ---------- */
    .chip {
        background: #F3E8D8;
        color: #1A3263;
        padding: .25rem .75rem;
        border-radius: 20px;
        font-size: .85rem;
        display: inline-block;
        margin: .25rem;
        cursor: pointer;
        border: none;
    }

    .chip.selected {
        background: #1A3263;
        color: #FFC570;
    }

    /* ---------- Modals ---------- */
    #sheet-lainnya {
        position: fixed;
        bottom: -100%;
        left: 0;
        right: 0;
        background: #fff;
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, .2);
        padding: 1rem;
        z-index: 1000;
        transition: bottom .3s ease;
    }

    #sheet-lainnya.open {
        bottom: 0;
    }

    .sheet {
        padding-bottom: 3rem;
    }

    .sheet h3 {
        margin-bottom: 1rem;
        color: #1A3263;
        font-size: 1.25rem;
    }

    .sheet .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
    }

    .sheet .tile {
        background: #F3E8D8;
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
        cursor: pointer;
        transition: transform .1s;
    }

    .sheet .tile:active {
        transform: scale(.98);
    }

    .sheet .tile .icon {
        width: 36px;
        height: 36px;
        margin: 0 auto .5rem;
        fill: #1A3263;
    }

    .sheet .tile span {
        color: #1A3263;
        font-size: .95rem;
        font-weight: 500;
    }

    /* ---------- Toasts ---------- */
    #toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(26, 50, 99, .95);
        color: #fff;
        padding: .75rem 1.5rem;
        border-radius: 24px;
        font-size: .95rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity .3s;
        z-index: 1500;
        white-space: nowrap;
    }

    #toast.show {
        opacity: 1;
    }

    /* ---------- Receipt ---------- */
    .receipt {
        font-family: monospace;
        font-size: .85rem;
        max-width: 80mm;
        margin: auto;
        background: #fff;
        padding: 1rem;
        box-shadow: 0 0 4px rgba(0, 0, 0, .2);
    }

    .receipt h3 {
        margin-bottom: .5rem;
        text-align: center;
    }

    .receipt .line {
        display: flex;
        justify-content: space-between;
        margin: .25rem 0;
    }

    .receipt .total {
        font-weight: 700;
        border-top: 1px dashed #ccc;
        padding-top: .25rem;
        margin-top: .25rem;
    }

    .receipt .footer {
        text-align: center;
        margin-top: 1rem;
        font-size: .8rem;
        color: #666;
    }

    /* ---------- Report ---------- */
    .report table {
        width: 100%;
        border-collapse: collapse;
        font-size: .85rem;
    }

    .report th,
    .report td {
        padding: .5rem .25rem;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    .report th {
        color: #1A3263;
        font-weight: 600;
    }

    .report .total {
        font-weight: 700;
        color: #1A3263;
    }

    /* ---------- Money ---------- */
    .money {
        font-weight: 600;
        color: #1A3263;
    }

    .money.neg {
        color: #A60000;
    }

    /* ---------- Utilities ---------- */
    .hidden {
        display: none !important;
    }

    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .mt1 {
        margin-top: .5rem;
    }

    .mb1 {
        margin-bottom: .5rem;
    }

    .text-center {
        text-align: center;
    }

    .text-muted {
        color: #547792;
    }
</style>
